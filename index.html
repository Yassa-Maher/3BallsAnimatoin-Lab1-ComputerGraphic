<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CG - Lab 1</title>
    <style>
        body { font-family: sans-serif; margin: 24px; }
        canvas {
            display: block; max-width: 100%; height: auto;
            background: #b3b3b4; margin: 12px 0;
            touch-action: none;
        }
        button, input, select { margin-right: 12px; margin-bottom: 8px; }
        .control-group { margin-bottom: 12px; }
    </style>
</head>
<body>
    <h1>Interactive Three Circles</h1>


    <!-- // control group for selecting circle and color and speed and (pause/reset buttons); -->

    <div class="control-group">
        <label for="selectCircle">Select Circle:</label>
        <select id="selectCircle">
            <option value="0">Circle 1</option>
            <option value="1">Circle 2</option>
            <option value="2">Circle 3</option>
        </select>

        <label for="color">Color:</label>
        <input id="color" type="color" value="#2563eb">
    </div>

    <div class="control-group">
        <label for="speedInput">Horizontal Speed:</label>
        <input id="speedInput" type="text" placeholder="e.g. 150">
        <button id="applySpeed" type="button">Apply Speed</button>
    </div>

    <div class="control-group">
        <button id="toggle" type="button">Pause</button>
        <button id="reset" type="button">Reset</button>
    </div>



    <!-- // the scene that shows the circles and their movement -->

    <canvas id="scene" width="640" height="360" aria-label="An animated scene with three circles">
        This example requires a browser with canvas support.
    </canvas>

    <!-- for displaying status messages (the current selected circle and its axis) -->
    <p id="status"></p>  
    <p>Click or touch to place the selected circle. Use the controls above to modify properties.</p>

    <script type="module" src="./dist/main.js"></script>
</body>
</html>
